name: Windows x64
on:
  push:
    branches: [main]
    paths: ['**.go', 'go.mod', 'go.sum', 'assistant.html', 'kokoro/**', 'REGRAS.md', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-x64-release
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        if: hashFiles('go.mod') != ''
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'
          architecture: x64
      - name: Montar pacote Kokoro para Windows x64
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'jarvis-kokoro'
          $pythonZip = Join-Path $env:RUNNER_TEMP 'python-embed.zip'
          $voiceBank = Join-Path $env:RUNNER_TEMP 'kokoro-voices.bin'
          $source = 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1'
          function Get-VerifiedFile($url, $path, $sha) {
            curl.exe --fail --silent --show-error --location --retry 3 --output $path $url
            if ($LASTEXITCODE -ne 0) { throw "Falha no download: $url" }
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $sha) { throw "SHA-256 inválido: $url" }
          }
          Get-VerifiedFile 'https://www.python.org/ftp/python/3.13.12/python-3.13.12-embed-amd64.zip' $pythonZip '76f238f606250c87c6beac75dccd35ee99070a13490555936abb6cb64ecce3d0'
          Expand-Archive -LiteralPath $pythonZip -DestinationPath $runtime -Force
          Set-Content -LiteralPath (Join-Path $runtime 'python313._pth') -Value @('python313.zip', '.', 'packages') -Encoding ascii
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -property installationPath
          $redist = Get-ChildItem -Path (Join-Path $visualStudio 'VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT') -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $redist) { throw 'Redistribuíveis C++ x64 não encontrados' }
          Copy-Item -Path (Join-Path $redist.FullName '*.dll') -Destination $runtime
          Get-VerifiedFile "$source/kokoro-v1.0.fp16.onnx" (Join-Path $runtime 'kokoro.onnx') 'f3a290d384fbb27966d462905c71a46cef9e5fd00516b40df32a0b4afe77ac96'
          Get-VerifiedFile "$source/voices-v1.0.bin" $voiceBank 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d'
          python -m pip install --only-binary=:all: --no-compile --target (Join-Path $runtime 'packages') -r kokoro/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $PWD 'JarvisKokoro-win-x64.zip'
          $env:PYTHONPATH = Join-Path $runtime 'packages'
          python -B kokoro/package.py $runtime $voiceBank $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "JARVIS_KOKORO_ARCHIVE=$archive" >> $env:GITHUB_ENV
          "JARVIS_KOKORO_SHA=$digest" >> $env:GITHUB_ENV
          "Kokoro ZIP: $((Get-Item -LiteralPath $archive).Length) bytes, SHA-256 $digest"
      - name: Preparar WebView2 para o teste nativo
        shell: pwsh
        run: |
          $product = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $locations = @("HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$product", "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$product")
          $versions = @($locations | ForEach-Object { (Get-ItemProperty -LiteralPath $_ -Name pv -ErrorAction SilentlyContinue).pv } | Where-Object { $_ -and $_ -ne '0.0.0.0' })
          if ($versions.Count -eq 0) {
            $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
            $signature = Get-AuthenticodeSignature -LiteralPath $setup
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Assinatura do instalador WebView2 inválida' }
            $install = Start-Process -FilePath $setup -ArgumentList '/silent /install' -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "Instalador WebView2: $($install.ExitCode)" }
          }
      - name: Testar e compilar no Windows
        if: hashFiles('go.mod') != ''
        shell: pwsh
        run: |
          if ((go env GOHOSTOS) -ne 'windows' -or (go env GOHOSTARCH) -ne 'amd64') { throw 'Runner inesperado' }
          go test -v ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags "-s -w -H=windowsgui -X main.kokoroPackageDigest=$env:JARVIS_KOKORO_SHA" -o JarvisLocal.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $marker = Join-Path $env:RUNNER_TEMP "jarvis-ready-$env:GITHUB_RUN_ID.txt"
          $process = Start-Process -FilePath .\JarvisLocal.exe -ArgumentList "--smoke `"$marker`"" -PassThru
          try {
            if (-not $process.WaitForExit(20000)) { throw 'Janela nativa não abriu dentro do prazo' }
            if ($process.ExitCode -ne 0 -or -not (Test-Path $marker)) { throw 'Smoke test da janela falhou' }
            Get-Content $marker
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          $panelMarker = Join-Path $env:RUNNER_TEMP "jarvis-panel-$env:GITHUB_RUN_ID.txt"
          $panel = Start-Process -FilePath .\JarvisLocal.exe -ArgumentList "--smoke-shell `"$panelMarker`"" -PassThru
          try {
            if (-not $panel.WaitForExit(45000)) { throw 'Painel WebView2 não iniciou dentro do prazo' }
            if ($panel.ExitCode -ne 0 -or -not (Test-Path $panelMarker)) { throw 'Smoke test do painel WebView2 falhou' }
            Get-Content $panelMarker
          } finally {
            if (-not $panel.HasExited) { Stop-Process -Id $panel.Id -Force }
          }
          Get-FileHash .\JarvisLocal.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        if: hashFiles('go.mod') != ''
        with:
          name: JarvisLocal-Windows-x64
          path: JarvisLocal.exe
          if-no-files-found: error
      - name: Publicar executável da versão
        if: hashFiles('go.mod') != '' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $match = Select-String -Path ota.go -Pattern '^const Version = "(v\d+\.\d+\.\d+)"$'
          if (-not $match) { throw 'Versão inválida' }
          $tag = $match.Matches[0].Groups[1].Value
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create $tag JarvisLocal.exe JarvisKokoro-win-x64.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Jarvis Local $tag" --notes "Executável Windows x64 compilado e verificado no runner Windows. Dora e Alex (Kokoro pt-BR): o aplicativo baixa o pacote de voz automaticamente no primeiro uso."
          exit $LASTEXITCODE
