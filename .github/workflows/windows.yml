name: Windows x64
on:
  push:
    branches: [main]
    paths: ['**.go', 'go.mod', 'go.sum', 'assistant.html', 'REGRAS.md', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-x64-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        if: hashFiles('go.mod') != ''
        with:
          go-version-file: go.mod
          cache: false
      - name: Testar e compilar no Windows
        if: hashFiles('go.mod') != ''
        shell: pwsh
        run: |
          if ((go env GOHOSTOS) -ne 'windows' -or (go env GOHOSTARCH) -ne 'amd64') { throw 'Runner inesperado' }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o JarvisLocal.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $marker = Join-Path $env:RUNNER_TEMP "jarvis-ready-$env:GITHUB_RUN_ID.txt"
          $process = Start-Process -FilePath .\JarvisLocal.exe -ArgumentList "--smoke `"$marker`"" -PassThru
          try {
            if (-not $process.WaitForExit(20000)) { throw 'Janela nativa não abriu dentro do prazo' }
            if ($process.ExitCode -ne 0 -or -not (Test-Path $marker)) { throw 'Smoke test da janela falhou' }
            Get-Content $marker
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          $panelMarker = Join-Path $env:RUNNER_TEMP "jarvis-panel-$env:GITHUB_RUN_ID.txt"
          $panel = Start-Process -FilePath .\JarvisLocal.exe -ArgumentList "--smoke-shell `"$panelMarker`"" -PassThru
          try {
            if (-not $panel.WaitForExit(45000)) { throw 'Painel WebView2 não iniciou dentro do prazo' }
            if ($panel.ExitCode -ne 0 -or -not (Test-Path $panelMarker)) { throw 'Smoke test do painel WebView2 falhou' }
            Get-Content $panelMarker
          } finally {
            if (-not $panel.HasExited) { Stop-Process -Id $panel.Id -Force }
          }
          Get-FileHash .\JarvisLocal.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        if: hashFiles('go.mod') != ''
        with:
          name: JarvisLocal-Windows-x64
          path: JarvisLocal.exe
          if-no-files-found: error
      - name: Publicar executável da versão
        if: hashFiles('go.mod') != '' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $match = Select-String -Path ota.go -Pattern '^const Version = "(v\d+\.\d+\.\d+)"$'
          if (-not $match) { throw 'Versão inválida' }
          $tag = $match.Matches[0].Groups[1].Value
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create $tag JarvisLocal.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Jarvis Local $tag" --notes "Executável Windows x64 compilado e verificado no runner Windows."
          exit $LASTEXITCODE
