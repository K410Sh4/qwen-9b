<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Jarvis</title>
<style>
:root { color-scheme:dark; font-family:"Segoe UI",system-ui,sans-serif; --text:#e8f3f5; --muted:#95b3bf; --cyan:#63ddef }
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;color:var(--text);user-select:none}
button,textarea,select{font:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #64ddec;outline-offset:2px}
#stage{width:100%;height:100%;position:relative}
.avatar{position:absolute;right:9px;bottom:0;width:255px;height:369px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.halo{position:absolute;top:36px;left:24px;width:207px;height:231px;border-radius:50%;border:1px solid rgba(66,201,247,.22);box-shadow:0 0 42px rgba(10,146,202,.17),inset 0 0 26px rgba(0,198,255,.09);pointer-events:none;animation:pulse 4s ease-in-out infinite}
.halo:after{content:"";position:absolute;inset:14px;border:1px dashed rgba(69,181,232,.23);border-radius:50%}
.mesh-canvas{position:absolute;top:7px;left:0;width:255px;height:302px;pointer-events:none;filter:drop-shadow(0 0 13px rgba(26,176,211,.15));animation:breathe 4.6s ease-in-out infinite}
#avatarButton{position:absolute;top:0;left:0;right:0;height:302px;background:transparent;border:0;border-radius:70px;cursor:grab;z-index:2}
#avatarButton:active{cursor:grabbing}
.status{position:absolute;bottom:52px;left:18px;right:18px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:30px;padding:7px 12px;background:rgba(10,31,45,.82);border:1px solid rgba(72,203,236,.25);box-shadow:0 8px 30px #0005;font-size:12px;white-space:nowrap;z-index:3}
.dot{width:7px;height:7px;border-radius:50%;background:#75f0c0;box-shadow:0 0 12px #59efa6}
.tools{position:absolute;bottom:8px;left:16px;right:16px;display:flex;gap:7px;justify-content:center;z-index:3}
.tool{border:1px solid rgba(75,175,214,.35);background:rgba(9,29,44,.89);color:#d6f5fa;border-radius:12px;height:34px;min-width:41px;display:grid;place-items:center;box-shadow:0 4px 18px #0004}
.tool:hover{background:rgba(18,71,91,.94)}
.tool svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body:not(.open) .conversation{display:none}
body.open .avatar{right:12px;bottom:0}
body.open .conversation{display:flex}
.conversation{position:absolute;left:8px;bottom:8px;top:8px;width:calc(100% - 295px);min-width:330px;flex-direction:column;background:rgba(9,24,37,.96);border:1px solid rgba(91,191,222,.31);box-shadow:0 16px 45px #0008;border-radius:19px;overflow:hidden;backdrop-filter:blur(18px)}
.top{height:55px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid rgba(100,177,205,.15)}
.top strong{font-size:16px;letter-spacing:.2px}
.top small{font-size:11px;color:var(--muted)}
.top .right{margin-left:auto}
.tiny{background:transparent;border:0;color:#b6cdda;font-size:21px;line-height:1;padding:6px}
.tiny:hover{color:white}
.messages{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:11px;user-select:text;scrollbar-color:#27516a transparent}
.msg{max-width:96%;align-self:flex-start;background:rgba(22,57,78,.75);border:1px solid #ffffff16;padding:10px 12px;border-radius:14px;font-size:13px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:rgba(23,75,87,.75)}
.msg.partial{opacity:.8}
#notice{min-height:17px;max-height:55px;overflow:auto;color:#ffb39b;font-size:11px;padding:0 13px}
.compose{display:flex;gap:7px;padding:9px 11px 12px;align-items:center}
textarea{flex:1;min-width:0;height:45px;max-height:85px;resize:none;background:#0a2031;color:var(--text);border:1px solid #31566a;border-radius:12px;padding:10px;font-size:13px;outline:none;user-select:text}
.send{border:0;background:#5bc5de;color:#0b2230;border-radius:10px;padding:11px 13px;font-weight:700}
.send:disabled{opacity:.4}
.settings{display:none;position:absolute;top:49px;right:10px;width:250px;z-index:20;padding:13px;border:1px solid #39728a;border-radius:13px;background:#092536;box-shadow:0 14px 35px #000c}
.settings.show{display:grid;gap:11px}
.settings label{font-size:12px;display:grid;gap:6px}
.settings select{background:#102f43;border:1px solid #315d70;border-radius:8px;color:var(--text);padding:8px}
.settings button{border:1px solid #43677a;border-radius:8px;padding:8px;background:#17394b;color:var(--text)}
.settings .line{display:flex;gap:7px;align-items:center}
.update-info{color:var(--muted);font-size:11px;line-height:1.35;padding:7px 2px 0}
#wave{position:absolute;bottom:84px;left:50%;width:42px;height:16px;transform:translateX(-50%);display:none;gap:3px;align-items:center;justify-content:center}
#wave i{width:3px;background:#74f0ff;height:6px;border-radius:3px;animation:beat .32s ease-in-out infinite alternate}
#wave i:nth-child(2){animation-delay:.08s}#wave i:nth-child(3){animation-delay:.17s}#wave i:nth-child(4){animation-delay:.04s}
body.speaking #wave,body.listening #wave{display:flex}
body.thinking .halo{animation-duration:1.4s}
body.executing .halo,body.building .halo,body.checking .halo,body.reviewing .halo{animation-duration:2s}
body.failure .halo{box-shadow:0 0 38px rgba(255,115,107,.30);border-color:rgba(255,115,107,.35)}
body.speaking .halo{box-shadow:0 0 46px rgba(51,206,240,.4)}
@keyframes breathe{50%{transform:translateY(-5px) scale(1.012)}}
@keyframes pulse{50%{opacity:.6;transform:scale(1.04)}}
@keyframes beat{to{height:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage">
  <section class="conversation" aria-label="Conversa Jarvis">
    <header class="top"><strong>Jarvis</strong><small id="version"></small>
    <button class="tiny right" id="settingsButton" title="Configurações" aria-label="Configurações">⚙</button>
    <button class="tiny" id="collapse" title="Recolher" aria-label="Recolher">×</button></header>
    <div class="settings" id="settings">
      <label class="line"><input type="checkbox" id="voice"> Responder em voz</label>
      <label>Voz <strong>Faber · Piper pt-BR</strong></label>
      <button id="preview">Ouvir prévia</button>
      <button id="classicTools">Abrir área de trabalho · Projetos e Missões</button>
      <button id="devImprove">Auto Melhorador: definir objetivo</button>
      <button id="devReview">Ver última proposta</button>
      <p class="update-info">O Auto Melhorador prepara patches locais; um PR draft só é criado após sua autorização.</p>
      <p class="update-info">Atualizações verificadas automaticamente no GitHub. O Jarvis só reinicia quando estiver ocioso e com o chat recolhido.</p>
      <button id="hide">Ocultar para bandeja</button>
      <button id="quit">Encerrar Jarvis</button>
    </div>
    <div class="messages" id="messages" role="log" aria-live="polite"></div>
    <div id="notice" role="status"></div>
    <form class="compose" id="compose">
      <textarea id="input" maxlength="3900" placeholder="Converse, abra Projetos, crie programas Go, revise melhorias..." aria-label="Mensagem"></textarea>
      <button class="send" id="send" type="submit">Enviar</button>
    </form>
  </section>
  <aside class="avatar" aria-label="Avatar flutuante do Jarvis">
    <div class="halo" aria-hidden="true"></div>
    <canvas class="mesh-canvas" id="faceMesh" width="256" height="304" aria-label="Rosto tridimensional geométrico do Jarvis"></canvas>
    <button id="avatarButton" title="Arrastar o avatar. Duplo clique para conversar." aria-label="Arrastar ou abrir conversa"></button>
    <div id="wave" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="status"><span class="dot"></span><strong>Jarvis</strong><span id="presence">Disponível</span></div>
    <div class="tools">
      <button class="tool" id="chat" title="Conversar" aria-label="Conversar"><svg viewBox="0 0 24 24"><path d="M20 11.5a8.5 8.5 0 0 1-9 8.4L4 21l1.5-4A8.5 8.5 0 1 1 20 11.5Z"/></svg></button>
      <button class="tool" id="mic" title="Ditado" aria-label="Ditado"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3m-4 0h8"/></svg></button>
      <button class="tool" id="minimize" title="Ocultar" aria-label="Ocultar"><svg viewBox="0 0 24 24"><path d="M4 12h16"/></svg></button>
      <button class="tool" id="exit" title="Encerrar" aria-label="Encerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </aside>
</div>
<script>window.jarvisMeshGeometry=__JARVIS_FACE_DATA__;</script>
<script>__JARVIS_FACE_RENDERER__</script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const pending=new Map();
let id=0,revision=0,activity="ready",requesting=false,polling=false,expanded=false,lastSignature="";
let lastFaceError="",faceOverride="",faceErrorTimer=null,backgroundActivity="";
function invoke(method,detail={}){
 return new Promise((resolve,reject)=>{
  const next=++id;
  const expiry=setTimeout(()=>{pending.delete(next);reject(new Error("Ação expirou: "+method));},18000);
  pending.set(next,{resolve,reject,expiry});
  window.chrome.webview.postMessage(JSON.stringify(Object.assign({id:next,token:"__JARVIS_BRIDGE_TOKEN__",method},detail)));
 });
}
window.jarvisResolve=(key,ok,value)=>{
 const call=pending.get(key);if(!call)return;
 pending.delete(key);clearTimeout(call.expiry);(ok?call.resolve:call.reject)(value);
};
const labels={
 ready:"Disponível",thinking:"Pensando",speaking:"Falando",listening:"Ouvindo",
 executing:"Executando",checking:"Verificando",building:"Construindo",
 reviewing:"Revisando",failure:"Falha na ação"
};
function applyFace(){
 const state=activity==="ready"?(faceOverride||backgroundActivity||"ready"):activity;
 $("presence").textContent=labels[state]||"Disponível";
 document.body.classList.remove(...Object.keys(labels));
 document.body.classList.add(state);
 if(window.jarvisSetFaceActivity)window.jarvisSetFaceActivity(state);
}
function updateFaceError(message){
 const next=String(message||"");
 if(next&&next!==lastFaceError){
   faceOverride="failure";
   clearTimeout(faceErrorTimer);
   faceErrorTimer=setTimeout(()=>{faceOverride="";applyFace();},2300);
 }else if(!next){
   faceOverride="";
   clearTimeout(faceErrorTimer);
 }
 lastFaceError=next;
}
function error(value){$("notice").textContent=String(value||"");}
function draw(lines,partial){
 const show=partial?lines.concat([{role:"assistant",content:partial,partial:true}]):lines;
 const sig=JSON.stringify(show);if(sig===lastSignature)return;lastSignature=sig;
 const scroll=$("messages"),bottom=scroll.scrollTop+scroll.clientHeight>=scroll.scrollHeight-55;
 scroll.replaceChildren();
 for(const msg of show){
  const node=document.createElement("div");node.className="msg "+(msg.role==="user"?"user":"assistant")+(msg.partial?" partial":"");
  node.textContent=msg.content;scroll.appendChild(node);
 }
 if(bottom)scroll.scrollTop=scroll.scrollHeight;
}
function busy(){const wait=activity!=="ready"||requesting;$("send").disabled=wait;$("mic").disabled=wait;$("preview").disabled=wait;}
async function refresh(force=false){
 if(polling||(!force&&document.hidden))return;
 polling=true;
 try{
  const s=await invoke("state",{revision});if(!s)return;
  revision=s.revision;activity=s.activity;backgroundActivity=s.backgroundActivity||"";
  updateFaceError(s.error);
  applyFace();
  draw(s.messages||[],s.partial||"");
  $("voice").checked=!!s.voice;
  if(s.error)error(s.error);
  if(s.draft){
   const dictation=await invoke("draft");
   if(dictation){await setPanel(true);$("input").value=dictation;$("input").focus();}
  }
  busy();
 }catch(e){error(e)}finally{polling=false;}
}
async function setPanel(value){
 if(expanded===value)return;
 await invoke("panel",{value});
 expanded=value;document.body.classList.toggle("open",expanded);
 if(expanded)$("input").focus();
}
async function send(){
 const val=$("input").value.trim();if(!val||requesting||activity!=="ready")return;
 requesting=true;busy();error("");
 try{await invoke("send",{text:val});$("input").value="";await refresh(true)}
 catch(e){error(e)}finally{requesting=false;busy();}
}
$("compose").addEventListener("submit",e=>{e.preventDefault();send();});
$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
$("chat").onclick=()=>setPanel(!expanded).catch(error);
$("collapse").onclick=()=>setPanel(false).catch(error);
$("avatarButton").addEventListener("dblclick",()=>setPanel(!expanded).catch(error));
$("avatarButton").addEventListener("pointerdown",e=>{if(e.detail<2)invoke("drag").catch(error);});
$("mic").onclick=async()=>{try{await invoke("listen");await refresh(true);}catch(e){error(e)}};
$("minimize").onclick=$("hide").onclick=()=>invoke("hide").catch(error);
$("exit").onclick=$("quit").onclick=()=>invoke("quit").catch(error);
$("settingsButton").onclick=()=>{$("settings").classList.toggle("show")};
$("voice").onchange=()=>invoke("voice",{value:$("voice").checked}).catch(error);
$("preview").onclick=()=>invoke("voicePreview").catch(error);
$("classicTools").onclick=async()=>{try{await invoke("classic");$("settings").classList.remove("show");}catch(e){error(e)}};
$("devImprove").onclick=async()=>{
 try { $("settings").classList.remove("show");await setPanel(true);
 $("input").value="Melhore seu código: ";$("input").focus(); }catch(e){error(e);}
};
$("devReview").onclick=async()=>{
 try { $("settings").classList.remove("show");await setPanel(true);
 $("input").value="Ver proposta da melhoria";$("input").focus(); }catch(e){error(e);}
};
window.addEventListener("keydown",e=>{if(e.key==="Escape"&&expanded)setPanel(false).catch(error)});
async function init(){
 try{
  const info=await invoke("info");
  $("version").textContent=info.version;
  await refresh(true);
  if(!window.jarvisFaceMeshReady||!window.jarvisFaceMeshInfo||window.jarvisFaceMeshInfo.triangles!==898)throw new Error("Renderização da face mesh indisponível");
  if(info.smoke){
   if(!info.voiceProfiles||info.voiceProfiles.length!==1||info.voiceProfiles[0].id!=="pt_BR-faber-medium")throw new Error("Faber não está disponível");
   const state=await invoke("state",{revision:0});
   if(state.voiceProfile!=="pt_BR-faber-medium")throw new Error("Falha ao escolher voz");
   await setPanel(true);await setPanel(false);
  }
  await invoke("ready");
  if(info.smoke){invoke("quit");return;}
  setInterval(()=>refresh(),350);
 }catch(e){error(e);}
}
init();
</script>
</body></html>
